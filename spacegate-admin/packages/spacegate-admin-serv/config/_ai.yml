#   #   reasoning: smart
#   #   plan: smart
#   #   execute: fast
#   #   extraction: fast
#   #   summary: fast
#   #   embedding: embedding
#   #   rerank: rerank
#   #   ocr: vision
#   #   fast: fast
#   # embedding / rerank / vision 须在 models 中声明对应厂商模型，不能只填写场景 ID。

