# # LLM 配置（必填）
# llm:
#   # API Key（约定环境变量 HAI_AI_LLM_APIKEY 优先）
#   apiKey: ${HAI_AI_LLM_APIKEY:}
#   # Base URL（约定环境变量 HAI_AI_LLM_BASEURL 优先）
#   # baseUrl: https://api.openai.com/v1
#   # 默认模型
#   model: ${HAI_AI_LLM_MODEL:gpt-4o-mini}
#   api: ${HAI_AI_LLM_API:chat} # chat | responses | anthropic
#   # 全局最大 Token 数（默认 4096）
#   # maxTokens: 4096
#   # 采样温度（0-2，默认 0.7）
#   # temperature: 0.7
#   # 请求超时（毫秒，默认 60000）
#   # timeout: 60000
#   # tempModelCacheTtl: 600000

#   # 多模型配置（可选，用于场景路由）
#   # models:
#   #   - id: fast
#   #     model: gpt-4o-mini
#   #     api: chat
#   #     apiKey: ''
#   #     baseUrl: https://api.openai.com/v1
#   #     maxTokens: 4096
#   #     temperature: 0.7
#   #     timeout: 60000
#   #   - id: smart
#   #     model: gpt-4o
#   #     apiKey: ''

#   # 场景模型映射（可选）
