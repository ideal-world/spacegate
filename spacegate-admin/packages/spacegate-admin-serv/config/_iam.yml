# =============================================================================
# IAM 配置
# =============================================================================

# 登录配置
login:
  password: ${HAI_IAM_LOGIN_PASSWORD:true}
  otp: ${HAI_IAM_LOGIN_OTP:false}
  ldap: ${HAI_IAM_LOGIN_LDAP:false}
  apikey: ${HAI_IAM_LOGIN_APIKEY:false}

# 注册与登录安全
# 公开注册默认关闭：账号由管理员通过现有用户管理创建；需要自助注册时显式设为 true。
register:
  enabled: ${HAI_IAM_REGISTER_ENABLED:false}
  defaultEnabled: ${HAI_IAM_REGISTER_DEFAULTENABLED:true}
security:
  maxLoginAttempts: ${HAI_IAM_SECURITY_MAXLOGINATTEMPTS:5}
  lockoutDuration: ${HAI_IAM_SECURITY_LOCKOUTDURATION:900}

# LDAP 可选认证：默认关闭（login.ldap: false）。服务包已显式依赖 ldapts，
# 启用后 IAM 在未注入 ldapClientFactory 时自动加载默认客户端；测试可通过 iam.init 注入工厂。
#
# 启用步骤：
#   1. 将 login.ldap 设为 true（或设置 HAI_IAM_LOGIN_LDAP=true）。
#   2. 取消下方 ldap 配置块注释，按目录实际值填写连接与属性映射。
#   3. 保持 register.defaultEnabled 为 true（HAI_IAM_REGISTER_DEFAULTENABLED=true），
#      IAM 自动同步的 LDAP 用户才可登录；公开注册仍由 register.enabled=false 关闭。
#      如确实需要新用户默认禁用，可显式设为 false，但 LDAP 首次登录将无法完成。
#   4. 仅通过服务端环境或 Secret Manager 注入 HAI_IAM_LDAP_BINDPASSWORD；
#      不要把绑定密码写入 YAML、镜像、前端构建变量或日志。
#
# 绑定账号（bindDn）用于只读检索用户目录；终端用户仍以检索到的 DN + 用户密码再次绑定认证。
# 首次 LDAP 登录按 rbac.defaultRole 同步为普通 user，不会按用户名、邮箱或域名自动提权；
# 管理员必须通过现有用户/角色管理显式授予 admin。
# ldap:
#   url: ${HAI_IAM_LDAP_URL:ldaps://ldap.example.com:636}
#   bindDn: ${HAI_IAM_LDAP_BINDDN:cn=service,dc=example,dc=com} # 只读检索服务账号 DN
#   bindPassword: ${HAI_IAM_LDAP_BINDPASSWORD:} # 仅环境/Secret 注入，YAML 不保存真实值
#   searchBase: ${HAI_IAM_LDAP_SEARCHBASE:ou=users,dc=example,dc=com} # 用户搜索 base DN
#   searchFilter: '(uid={{username}})' # {{username}} 由 IAM 转义后替换，不要拼接原始输入
#   usernameAttribute: uid
#   emailAttribute: mail
#   displayNameAttribute: cn
#   useTls: false # ldap:// 连接可开启 STARTTLS；ldaps:// 已使用 TLS
#   connectTimeout: 5000 # 连接/操作超时，单位毫秒
# API Key 登录可选；密钥管理入口由应用按权限接入。
# apikey:
#   maxKeysPerUser: 10
#   defaultExpirationDays: 0 # 0 表示不限制有效期
#   prefix: hai_
# OTP 需启用 login.otp，并选择 Reach 标准模板或自定义发送回调。
# 保留默认策略入口，单独切换 login.otp 即可启用验证码登录。
otp: {}
# 定制策略时用下方配置块替换空对象，或通过 HAI_IAM_OTP 整体覆盖。
# otp:
#   email: true
#   sms: true
#   length: 6
#   expiresIn: 300
#   maxAttempts: 3
#   resendInterval: 60
passwordReset:
  enabled: ${HAI_IAM_PASSWORDRESET_ENABLED:true}
  mode: ${HAI_IAM_PASSWORDRESET_MODE:email} # phone 使用 password_reset_sms 模板
  tokenExpiresIn: ${HAI_IAM_PASSWORDRESET_TOKENEXPIRESIN:3600}
  maxAttempts: ${HAI_IAM_PASSWORDRESET_MAXATTEMPTS:3}
  # resetUrl: https://example.com/auth/reset-password
agreements:
  showOnRegister: true
  showOnLogin: false
  # 用 | 配置 Markdown 正文；同主题同时提供 URL 时优先显示正文。
  userAgreementMarkdown: |
    # 用户协议示例

    请妥善保管账户凭据，并按应用提供的功能使用服务。
  privacyPolicyMarkdown: |
    # 隐私政策示例

    注册资料用于账户管理，会话信息用于身份认证。
  # userAgreementUrl: https://example.com/terms
  # privacyPolicyUrl: https://example.com/privacy
ui:
  variant: split
  # title/subtitle 留空时使用框架内置的“登录/欢迎回来”文案。
  brandTitle: SpaceGate
  brandText: 网关、路由、插件与 AI 队列集中管理；每次变更都有版本，写入必须基于最新版本，冲突显式提示。
  # 相对路径由各端 public/ 提供；Web/App/Desktop 各自维护同名资源，也可改为绝对 HTTPS 地址。
  logoUrl: /logo.svg
  illustrationUrl: /auth-illustration.svg

  # 密码策略
password:
  minLength: ${HAI_IAM_PASSWORD_MINLENGTH:8}
  maxLength: ${HAI_IAM_PASSWORD_MAXLENGTH:128}
  requireUppercase: ${HAI_IAM_PASSWORD_REQUIREUPPERCASE:false}
  requireLowercase: ${HAI_IAM_PASSWORD_REQUIRELOWERCASE:false}
  requireNumber: ${HAI_IAM_PASSWORD_REQUIRENUMBER:false}
  requireSpecialChar: ${HAI_IAM_PASSWORD_REQUIRESPECIALCHAR:false}
  expirationDays: ${HAI_IAM_PASSWORD_EXPIRATIONDAYS:0} # 0 表示不限制密码有效期

# 会话配置
session:
  maxAge: ${HAI_IAM_SESSION_MAXAGE:86400} # 会话超时（秒），默认 24 小时
  sliding: ${HAI_IAM_SESSION_SLIDING:true} # 滑动窗口（每次请求刷新过期时间）
  singleDevice: ${HAI_IAM_SESSION_SINGLEDEVICE:false} # 单设备登录
  refreshTokenMaxAge: ${HAI_IAM_SESSION_REFRESHTOKENMAXAGE:604800} # refreshToken 过期（秒），默认 7 天

# RBAC 配置
rbac:
  enabled: true
  superAdminRole: super_admin
  defaultRole: user

# 是否自动创建默认数据
seedDefaultData: ${HAI_IAM_SEEDDEFAULTDATA:false}
