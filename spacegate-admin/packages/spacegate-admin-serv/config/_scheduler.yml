# # 未启用：安装对应模块并在服务端 runtime 中初始化，再取消所需配置的注释。
# # =============================================================================
# # 任务调度配置 (@h-ai/scheduler)
# # =============================================================================

# # 必须先初始化共享 @h-ai/reldb；执行日志和租约始终落库，不能设 false
# enableDb: ${HAI_SCHEDULER_ENABLEDB:true}

# # 检查间隔（毫秒）
# tickInterval: ${HAI_SCHEDULER_TICKINTERVAL:1000}

# # 执行租约（1000～86400000 毫秒，运行中自动续期）；unknown 须人工核对并先停止旧执行
# leaseMs: ${HAI_SCHEDULER_LEASEMS:300000}

# # 节点 ID 默认自动生成；多节点部署时每个实例应使用独立 ID。
# # nodeId: worker-1
# # 尝试日志保留策略（不删除执行journal与去重历史）
# # maxLogs: 10000
# # retentionDays: 30
