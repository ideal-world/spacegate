# Strategic Merge Patch：通过 kubectl patch --type=strategic --patch-file 使用。
# 不是完整 DaemonSet，不能直接 kubectl apply 本文件或整个目录。
# 保留现场 hostNetwork、ServiceAccount、resources、插件/证书卷和无关环境变量。
# envFrom 是原子列表：若现场已有其他必要引用，在下面列表中一并保留。
spec:
  template:
    spec:
      # 按现场长请求退出预算核对；先停止新增流量并等待队列/执行/Body 清零。
      terminationGracePeriodSeconds: 60
      containers:
        - name: spacegate
          image: spacegate:v2026.11.20-queue-001
          imagePullPolicy: IfNotPresent
          # 使用新镜像自带的 HAI ENTRYPOINT。
          command: null
          args: null
          envFrom:
            - secretRef:
                name: spacegate-config-v2026.11.20-queue-001
          env:
            # 删除被 spacegate.env 接管的显式旧值，避免 env 覆盖 envFrom。
            - name: STARTUP_MODE
              $patch: delete
            - name: CONFIG
              $patch: delete
            - name: K8S_NAMESPACE
              $patch: delete
            - name: GATEWAY_CLASS_NAME
              $patch: delete
            - name: CONFIG_FILE_PATH
              $patch: delete
            - name: PLUGIN_DIR
              $patch: delete
            - name: RUST_LOG
              $patch: delete
            - name: HAI_QUEUE_ADMIN_TOKEN
              $patch: delete
            - name: AWS_ACCESS_KEY_ID
              $patch: delete
            - name: AWS_SECRET_ACCESS_KEY
              $patch: delete
            - name: AWS_SESSION_TOKEN
              $patch: delete
          # PLUGIN_DIR 必须与现场现有挂载匹配；本补丁不删除插件卷。
          # 当前纯网关不含旧 ai_gateway_queue.wasm，旧绑定需先补制品或迁移。
