# 新 Admin / 原生队列的集中配置模板。复制到私有发布目录后填写，禁止提交真实凭据。
# 示例范围：namespace=spacegate，版本=v2026.11.20-queue-001。
# 必改：REPLACE_*、实际 namespace/GatewayClass/DaemonSet、存储寻址方式及镜像版本。
# 本地真实连接、测试策略见 docs/k8s/native-queue-release-runbook.md 第 6 节及附录 A。
apiVersion: v1
kind: ConfigMap
metadata:
  name: spacegate-admin-config-v2026.11.20-queue-001
  namespace: spacegate
data:
  # 当前本地为 development；受控测试使用 test。生产两项均改 production，
  # 并在下面 Admin Secret 中补齐真实通知 Provider，不能保留 console 默认。
  NODE_ENV: "test"
  HAI_CORE_ENV: "test"
  HAI_CORE_LOGGING_LEVEL: "info"

  # 当前本地是 file:/etc/spacegate；K8s 使用现场已有资源，不复制本地文件目录。
  CONFIG: "k8s:spacegate"
  GATEWAY_CLASS_NAME: "spacegate"
  GATEWAY_INSTANCE: "spacegate.spacegate"

  # 当前本地为 http://127.0.0.1:9080,http://localhost:9080。
  HAI_SERV_CORS_ORIGIN: "https://REPLACE_ADMIN_HOST"
  HAI_SERV_CORS_CREDENTIALS: "true"
  PUBLIC_API_BASE: ""
  HAI_SPACEGATE_ADMINAK: "spacegate-admin"

  # 当前本地为 host.docker.internal:5432 / spacegate_admin / user。
  HAI_DB_TYPE: "postgresql"
  HAI_DB_HOST: "REPLACE_POSTGRES_HOST"
  HAI_DB_PORT: "5432"
  HAI_DB_DATABASE: "spacegate_admin"
  HAI_DB_USER: "REPLACE_POSTGRES_USER"
  HAI_DB_SSL: "false"
  # 空值避免遗留 URL 覆盖上述分项；使用 URL 时放入 Secret 并删除这里同名字段。
  HAI_DB_URL: ""

  # 当前本地为 host.docker.internal:6379 / db 0 / spacegate-admin_。
  HAI_CACHE_TYPE: "redis"
  HAI_CACHE_HOST: "REPLACE_ADMIN_REDIS_HOST"
  HAI_CACHE_PORT: "6379"
  HAI_CACHE_DB: "0"
  HAI_CACHE_KEYPREFIX: "spacegate-admin_"
  HAI_CACHE_TLS: "false"
  HAI_CACHE_URL: ""

  # Admin 头像等资源；不是网关请求体存储。当前本地 endpoint 为
  # http://host.docker.internal:19000，bucket 为 spacegate-admin-hub-test。
  HAI_STORAGE_TYPE: "s3"
  HAI_STORAGE_ENDPOINT: "https://REPLACE_ADMIN_STORAGE_HOST"
  HAI_STORAGE_BUCKET: "REPLACE_ADMIN_STORAGE_BUCKET"
  HAI_STORAGE_REGION: "us-east-1"
  HAI_STORAGE_FORCEPATHSTYLE: "true"

  # 当前本地 target：id=hub-test / gateway=hai-hub / runtimeGateway=hai-hub-dev /
  # baseUrl=http://spacegate:8888。K8s 管理端口当前默认 9876，以现场监听为准。
  # 多个进程增加独立目标，不用负载均衡地址的一次成功代替每副本核验。
  HAI_SPACEGATE_NATIVEQUEUETARGETS: >-
    [{"id":"test-node-1","gateway":"REPLACE_GATEWAY_NAME","runtimeGateway":"REPLACE_RUNTIME_GATEWAY_NAME","baseUrl":"http://REPLACE_GATEWAY_NODE_IP:9876","tokenEnv":"HAI_QUEUE_ADMIN_TOKEN"}]
---
apiVersion: v1
kind: Secret
metadata:
  name: spacegate-admin-private-v2026.11.20-queue-001
  namespace: spacegate
type: Opaque
stringData:
  # 空用户库首次创建 admin；已有用户不重置密码。使用生成器/受管原件，不能用占位值。
  HAI_ADMIN_DEFAULT_PASSWORD: "REPLACE_INITIAL_ADMIN_PASSWORD"
  # 按手册生成真实 SM2 key；全部副本/后续升级复用同一套受管密钥。
  HAI_CRYPTO_TRANSPORT_SERVERKEYRING: >-
    {"activeKeyId":"test-v1","keys":{"test-v1":{"publicKey":"REPLACE_SM2_PUBLIC_KEY","privateKey":"REPLACE_SM2_PRIVATE_KEY"}}}
  HAI_SPACEGATE_ADMINSK: "REPLACE_INTERNAL_ADMIN_SK"
  HAI_RUST_JWT_KEY: "REPLACE_BASE64_OF_32_RANDOM_BYTES"
  HAI_DB_PASSWORD: "REPLACE_POSTGRES_PASSWORD"
  # 无密码 Redis 填空字符串；不要将占位值当成默认密码。
  HAI_CACHE_PASSWORD: "REPLACE_ADMIN_REDIS_PASSWORD_OR_EMPTY"
  HAI_STORAGE_ACCESSKEYID: "REPLACE_ADMIN_STORAGE_ACCESS_KEY"
  HAI_STORAGE_SECRETACCESSKEY: "REPLACE_ADMIN_STORAGE_SECRET_KEY"
  # production 必须配置真实 Provider，并与 _reach.yml 的模板名称匹配。
  # HAI_REACH_PROVIDERS: '[{"name":"email","type":"smtp",...},{"name":"sms","type":"api",...}]'
---
apiVersion: v1
kind: Secret
metadata:
  name: hai-quota-runtime-v2026.11.20-queue-001
  namespace: spacegate
type: Opaque
stringData:
  # 至少 32 字符。只填写一次，由 Admin 和网关分别引用；已有部署复用原 token。
  HAI_QUEUE_ADMIN_TOKEN: "REPLACE_SHARED_QUEUE_TOKEN_AT_LEAST_32_CHARACTERS"
  # 仅网关读取，供 queue.body_storage.s3 使用，区别于 Admin 的 HAI_STORAGE_*。
  AWS_ACCESS_KEY_ID: "REPLACE_GATEWAY_BODY_STORAGE_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_GATEWAY_BODY_STORAGE_SECRET_KEY"
  # 临时凭据需要时启用，并同时在 gateway.patch.yaml 增加同名 secretKeyRef。
  # AWS_SESSION_TOKEN: "REPLACE_TEMPORARY_SESSION_TOKEN"
