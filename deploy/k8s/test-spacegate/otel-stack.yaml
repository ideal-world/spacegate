apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacegate-clickhouse
  labels:
    app: spacegate-clickhouse
    app.kubernetes.io/part-of: spacegate-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spacegate-clickhouse
  template:
    metadata:
      labels:
        app: spacegate-clickhouse
        app.kubernetes.io/part-of: spacegate-test
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_DB
              value: otel
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ""
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spacegate-clickhouse
  labels:
    app: spacegate-clickhouse
    app.kubernetes.io/part-of: spacegate-test
spec:
  selector:
    app: spacegate-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spacegate-otel-collector-config
  labels:
    app: spacegate-otel-collector
    app.kubernetes.io/part-of: spacegate-test
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # 只保留 HAI 审计行和 WARN/ERROR 日志；普通 INFO 访问日志不再入库。
      filter/audit_logs:
        error_mode: ignore
        log_conditions:
          - context: log
            conditions:
              - 'severity_number < 13 and not (attributes["event"] == "http_access" and (attributes["route_name"] == "hai-route" or IsMatch(attributes["path"], "^/api/v1/[^/]+/[^/]+(/.*)?$") or IsMatch(attributes["path"], "^/mcp-services/[^/]+(/.*)?$") or IsMatch(attributes["status_code"], "^[45][0-9][0-9]$")))'

      # req 可能携带 Authorization 等请求头，禁止进入 ClickHouse。
      attributes/scrub:
        actions:
          - key: req
            action: delete
          - key: code.file.path
            action: delete
          - key: code.module.name
            action: delete
          - key: code.line.number
            action: delete
          - key: target
            action: delete
          - key: thread.name
            action: delete
          - key: thread.id
            action: delete
          - key: idle_ns
            action: delete
          - key: busy_ns
            action: delete

      attributes/log_slim:
        actions:
          - key: host
            action: delete
          - key: peer_addr
            action: delete
          - key: downstream_remote_address
            action: delete
          - key: request_body_size
            action: delete
          - key: response_body_size
            action: delete
          - key: x_forwarded_for
            action: delete
          - key: user_agent
            action: delete
          - key: protocol_name
            action: delete

      # traces 不参与看板：丢弃健康检查/连接级 span 和 INFO/DEBUG span event。
      filter/noise_spans:
        error_mode: ignore
        trace_conditions:
          - context: span
            conditions:
              - 'span.name == "GET /iam/ui/"'
              - 'span.name == "route"'
              - 'span.name == "connection"'
          - context: spanevent
            conditions:
              - 'spanevent.name == "http access log"'
              - 'spanevent.attributes["level"] != "WARN" and spanevent.attributes["level"] != "ERROR"'

      probabilistic_sampler:
        sampling_percentage: 10
        hash_seed: 42

      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 10000

    exporters:
      clickhouse:
        endpoint: tcp://spacegate-clickhouse:9000?dial_timeout=10s
        database: otel
        async_insert: true
        compress: lz4
        # 只对新建表生效；已有表需执行 ALTER TABLE ... MODIFY TTL。
        ttl: 720h
        create_schema: true
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        timeout: 5s
        metrics_tables:
          gauge:
            name: otel_metrics_gauge
          sum:
            name: otel_metrics_sum
          summary:
            name: otel_metrics_summary
          histogram:
            name: otel_metrics_histogram
          exponential_histogram:
            name: otel_metrics_exp_histogram
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/noise_spans, attributes/scrub, probabilistic_sampler, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/audit_logs, attributes/scrub, attributes/log_slim, batch]
          exporters: [clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacegate-otel-collector
  labels:
    app: spacegate-otel-collector
    app.kubernetes.io/part-of: spacegate-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spacegate-otel-collector
  template:
    metadata:
      labels:
        app: spacegate-otel-collector
        app.kubernetes.io/part-of: spacegate-test
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.152.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spacegate-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: spacegate-otel-collector
  labels:
    app: spacegate-otel-collector
    app.kubernetes.io/part-of: spacegate-test
spec:
  selector:
    app: spacegate-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
